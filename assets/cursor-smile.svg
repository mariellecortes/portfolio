<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 58">
  <!-- Arrow cursor pointer -->
  <polygon
    points="4,2 4,32 11,25 16,37 21,35 16,23 26,23"
    fill="#111111"
    stroke="white"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Smiley face (anchored bottom-right, near arrow) -->
  <!-- Base yellow circle -->
  <circle cx="42" cy="42" r="15" fill="#F5C400"/>
  <!-- Highlight / 3D feel -->
  <ellipse cx="37" cy="35" rx="7" ry="4.5" fill="rgba(255,255,200,0.45)" transform="rotate(-20 37 35)"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="40" rx="2.2" ry="2.8" fill="#2a1200"/>
  <ellipse cx="46" cy="40" rx="2.2" ry="2.8" fill="#2a1200"/>
  <!-- Eye shine -->
  <circle cx="39.2" cy="38.5" r="0.9" fill="white" opacity="0.75"/>
  <circle cx="47.2" cy="38.5" r="0.9" fill="white" opacity="0.75"/>
  <!-- Smile -->
  <path d="M35.5 45.5 Q42 52 48.5 45.5" stroke="#2a1200" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
